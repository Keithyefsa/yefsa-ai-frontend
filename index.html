
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YEFSATECH</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#000000">

    <link rel="apple-touch-icon" href="./yefsatech-icon-192.png">
</head>

<body>

<!-- =================================
     YEFSATECH HOME SCREEN
================================= -->

<main id="homeScreen">

    <div class="welcome-section">
        <h1 id="welcomeGreeting">Welcome</h1>
    </div>

    <section class="home-features">

        <!-- YEFSA AI -->
        <button
            id="openYefsaAiBtn"
            class="feature-card yefsa-card"
            type="button">

            <div class="feature-icon">💬</div>

            <strong>Yefsa AI</strong>

            <span>Conversation / Business Assistant</span>

        </button>

        <!-- BMY -->
        <button
            id="openBmyBtn"
            class="feature-card bmy-card"
            type="button">

            <div class="feature-icon">💼</div>

            <strong>BMY</strong>

            <span>Business Management by Yefsa</span>

        </button>

        <!-- FUTURE FEATURE 3 -->
        <!-- Add the next feature here when ready -->

        <!-- FUTURE FEATURE 4 -->

        <!-- FUTURE FEATURE 5 -->

        <!-- FUTURE FEATURE 6 -->

    </section>

    <footer class="home-footer">
        POWERED BY YEFSATECH
    </footer>

</main>


<!-- =================================
     YEFSA AI SCREEN
================================= -->

<main id="chatScreen" class="app-screen" hidden>

    <header class="app-header">

        <button
            id="backHomeFromChatBtn"
            class="back-btn"
            type="button">
            ←
        </button>

        <h1>Yefsa AI</h1>

        <div class="menu-container">

            <button id="menuBtn" class="menu-btn" type="button">
                ☰
            </button>

            <div id="dropdownMenu" class="dropdown-menu" hidden>

                <button id="newChatBtn" type="button">
                    ➕ New Chat
                </button>

                <button id="deleteChatBtn" type="button">
                    🗑️ Delete Chat
                </button>

                <button id="historyBtn" type="button">
                    🕘 Chat History
                </button>

                <a href="https://wa.me/256746493603"
                   target="_blank"
                   rel="noopener noreferrer">
                    🟢 Chat with Developer
                </a>

                <button id="subscribeBtn" type="button">
                    ⭐ Subscribe
                </button>

            </div>

        </div>

    </header>

    <div id="historyPanel" class="history-panel" hidden>

        <div class="history-header">

            <h2>Chat History</h2>

            <button id="closeHistoryBtn" type="button">
                ✕
            </button>

        </div>

        <div id="historyList" class="history-list"></div>

    </div>

    <div class="chat-container">

        <div class="chat-box" id="chatBox">

            <div class="message bot">
                Hello! I'm Yefsa AI. How can I help you today?
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Message Yefsa AI..."
            >

            <button id="sendBtn" type="button">
                Send
            </button>

        </div>

    </div>

</main>


<!-- =================================
     BMY SCREEN
================================= -->

<main id="bmyScreen" class="app-screen bmy-screen" hidden>

    <header class="app-header">

        <button
            id="backHomeFromBmyBtn"
            class="back-btn"
            type="button">
            ←
        </button>

        <h1>BMY</h1>

    </header>

    <section class="bmy-welcome">

        <h2>Business Management by Yefsa</h2>

        <p>
            Your business management workspace is coming soon.
        </p>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
